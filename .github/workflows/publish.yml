name: publish

# Publishes in.nijatva.no-gms-check:<version> to GitHub Packages on a release tag.
# NOTE: this repo has no Gradle wrapper, so the workflow uses the gradle action,
# not ./gradlew. Its own build.yml does the same.
# App builds then resolve it with a plugins { } block; no includeBuild, no local path.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.1.0"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Version from tag or input
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ inputs.version }}"
          fi
          echo "publishing version $V"
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Set version in build file
        run: |
          sed -i "s/^version = .*/version = \"$VERSION\"/" build.gradle.kts
          grep '^version' build.gradle.kts

      - name: Test the plugin
        run: gradle test --no-daemon

      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle publish --no-daemon
